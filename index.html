<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pond Dash</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2349bdea'/%3E%3Cellipse cx='14' cy='20' rx='9' ry='6' fill='%23ffc93c'/%3E%3Ccircle cx='20' cy='12' r='5' fill='%23ffc93c'/%3E%3Cpath d='M24 11l5 1.5-5 2z' fill='%23ff8c1a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 40 32" width="40" height="32" aria-hidden="true">
          <ellipse cx="17" cy="21" rx="14" ry="9" fill="#ffc93c" stroke="#1d2b53" stroke-width="2" />
          <circle cx="27" cy="10" r="7" fill="#ffc93c" stroke="#1d2b53" stroke-width="2" />
          <path d="M33 8l6 2.5-6 2.5z" fill="#ff8c1a" stroke="#1d2b53" stroke-width="1.5" stroke-linejoin="round" />
          <circle cx="29" cy="8.5" r="1.4" fill="#1d2b53" />
        </svg>
        <span>Pond Dash</span>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-view="race">Duck Race</button>
        <button type="button" role="tab" data-view="wheel">Wheel of Names</button>
      </nav>
    </header>

    <main class="layout">
      <section id="stage" class="stage">
        <canvas id="scene"></canvas>
        <canvas id="confetti"></canvas>

        <div id="hud" class="hud" hidden>
          <ol id="leaders" class="leaders"></ol>
          <div class="hud-centre">
            <div class="race-controls">
              <button type="button" id="pause" class="ctl" hidden>Pause</button>
              <button type="button" id="clear" class="ctl" hidden>Clear</button>
            </div>
            <div id="timer" class="timer">1:00.0</div>
          </div>
        </div>

        <div class="tools">
          <button type="button" id="mute" class="tool" aria-label="Toggle sound"></button>
          <button type="button" id="fullscreen" class="tool" aria-label="Toggle fullscreen">⛶</button>
        </div>

        <div id="caller" class="caller" hidden></div>
        <div id="banner" class="banner" hidden></div>
        <div id="flash" class="flash"></div>
        <div id="countdown" class="countdown" hidden></div>

        <div id="start" class="start">
          <button type="button" id="go" class="big">Start race</button>
          <p id="hint" class="hint"></p>
        </div>

        <div id="results" class="results" hidden>
          <div class="card result-card">
            <p class="eyebrow">Winner</p>
            <h2 id="winner"></h2>
            <div id="podium" class="podium" hidden></div>
            <ol id="placings" class="placings"></ol>
            <div class="row">
              <button type="button" id="again" class="big">Race again</button>
              <button type="button" id="clear-result" class="ghost">Clear</button>
              <button type="button" id="edit" class="ghost">Edit list</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="card">
          <div class="card-head">
            <h3>Entrants</h3>
            <span id="count" class="pill"></span>
          </div>
          <div class="segmented" id="mode">
            <button type="button" data-mode="names">Names</button>
            <button type="button" data-mode="numbers">Numbers</button>
          </div>

          <div id="names-pane">
            <textarea id="names" rows="9" spellcheck="false" placeholder="One name per line"></textarea>
            <p id="names-note" class="note"></p>
            <div class="row">
              <input id="list-name" type="text" maxlength="40" placeholder="List name" aria-label="List name" />
              <button type="button" id="save-list" class="ghost">Save</button>
            </div>
            <div id="saved" class="chips"></div>
          </div>

          <div id="numbers-pane" hidden>
            <label class="field">
              <span>How many ducks?</span>
              <input id="number" type="number" min="2" max="200" step="1" />
            </label>
          </div>
          <p class="note">The duck race and the wheel share this list.</p>
        </div>

        <div class="card" id="time-card">
          <div class="card-head"><h3>Race time</h3></div>
          <div class="segmented" id="presets">
            <button type="button" data-seconds="60">1 min</button>
            <button type="button" data-seconds="120">2 min</button>
            <button type="button" data-seconds="180">3 min</button>
          </div>
          <label class="field">
            <span>Custom (seconds)</span>
            <input id="duration" type="number" min="5" max="600" step="1" />
          </label>
          <label class="check">
            <input id="hazards" type="checkbox" />
            <span>River hazards and boosts</span>
          </label>
          <p class="note">Whirlpools and lily pads hold ducks up; fast currents fling them forward.</p>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
